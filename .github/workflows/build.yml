name: 构建Windows可执行文件

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
    
    - name: 设置Python环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller
    
    - name: 打包图形界面版本
      run: |
        pyinstaller --onefile --windowed --name "股票查询工具" --hidden-import akshare --hidden-import pandas --collect-all akshare --collect-data akshare 股票查询工具_图形界面版.py
    
    - name: 打包命令行版本
      run: |
        pyinstaller --onefile --console --name "股票查询工具_命令行" --hidden-import akshare --hidden-import pandas --collect-all akshare --collect-data akshare 股票查询工具_命令行版.py
    
    - name: 上传可执行文件
      uses: actions/upload-artifact@v4
      with:
        name: Windows可执行文件
        path: |
          dist/股票查询工具.exe
          dist/股票查询工具_命令行.exe
        retention-days: 30
